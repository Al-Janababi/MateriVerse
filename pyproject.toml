[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materiverse-eval"
version = "0.1.0"
description = "MateriVerse: reference implementation and evaluation toolkit (computational discovery of candidate superconductors)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
chem = ["ase>=3.22", "pymatgen>=2024.1.1", "mace-torch>=0.3.4"]

[project.scripts]
materiverse-eval = "materiverse_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
